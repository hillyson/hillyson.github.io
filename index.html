<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivor.C Studio</title>
  <meta name="description" content="Ivor.C Studio — 用心打造的 iOS 小工具。产品介绍、技术支持与隐私政策。" />
  <link rel="icon" type="image/svg+xml" href="web-blog/assets/favicon.svg" />
  <link rel="stylesheet" href="web-blog/css/styles.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .splash {
      position: relative;
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
      padding: 40px 22px;
    }
    .splash-inner { position: relative; z-index: 1; max-width: 640px; }
    .splash .brand-mark {
      width: 68px; height: 68px; border-radius: 18px;
      margin: 0 auto 26px; font-size: 1.7rem;
    }
    .splash h1 { font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 800; margin-bottom: 16px; }
    .splash p.lead {
      font-size: clamp(1.05rem, 2.6vw, 1.25rem);
      color: var(--text-soft);
      margin: 0 auto 34px;
      max-width: 500px;
    }
    .splash-actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .splash-foot {
      position: relative; z-index: 1;
      padding: 24px; text-align: center;
      color: var(--text-faint); font-size: 0.86rem;
      border-top: 1px solid var(--border);
    }
    .splash-foot a { color: var(--text-soft); }
    .splash-foot a:hover { color: var(--text); }
  </style>
</head>
<body>
  <main class="splash">
    <div class="hero-blob b1"></div>
    <div class="hero-blob b2"></div>
    <div class="hero-blob b3"></div>
    <div class="splash-inner">
      <div class="brand-mark">IC</div>
      <h1><span class="gradient-text">Ivor.C Studio</span></h1>
      <p class="lead">用心打造的 iOS 小工具。这里汇集产品介绍、技术支持与隐私政策。</p>
      <div class="splash-actions">
        <a class="btn btn-primary" href="web-blog/">进入网站 →</a>
        <a class="btn btn-ghost" href="web-blog/support.html">技术支持</a>
        <a class="btn btn-ghost" href="web-blog/privacy/index.html">隐私政策</a>
      </div>
    </div>
  </main>
  <footer class="splash-foot">
    © <span id="y"></span> Ivor.C Studio · <a href="web-blog/">作品与技术支持</a>
  </footer>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
