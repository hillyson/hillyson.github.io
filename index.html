<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivor.C Studio</title>
  <meta name="description" content="Ivor.C Studio — 用心打造的 iOS 小工具。产品介绍、技术支持与隐私政策。" />
  <link rel="icon" type="image/svg+xml" href="web-blog/assets/favicon.svg" />
  <link rel="stylesheet" href="web-blog/css/styles.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .splash {
      position: relative;
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
      padding: 40px 22px;
    }
    .splash-inner { position: relative; z-index: 1; max-width: 640px; }
    .splash .brand-mark {
      width: 68px; height: 68px; border-radius: 18px;
      margin: 0 auto 26px; font-size: 1.7rem;
    }
    .splash h1 { font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 800; margin-bottom: 16px; }
    .splash p.lead {
      font-size: clamp(1.05rem, 2.6vw, 1.25rem);
      color: var(--text-soft);
      margin: 0 auto 34px;
      max-width: 500px;
    }
    .splash-actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .splash-foot {
      position: relative; z-index: 1;
      padding: 24px; text-align: center;
      color: var(--text-faint); font-size: 0.86rem;
      border-top: 1px solid var(--border);
    }
    .splash-foot a { color: var(--text-soft); }
    .splash-foot a:hover { color: var(--text); }
    .splash-lang {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="splash-lang">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="zh" class="on">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <main class="splash">
    <div class="hero-blob b1"></div>
    <div class="hero-blob b2"></div>
    <div class="hero-blob b3"></div>
    <div class="splash-inner">
      <div class="brand-mark">IC</div>
      <h1><span class="gradient-text">Ivor.C Studio</span></h1>
      <p class="lead" id="splash-lead">用心打造的 iOS 小工具。这里汇集产品介绍、技术支持与隐私政策。</p>
      <div class="splash-actions">
        <a class="btn btn-primary" href="web-blog/" id="splash-enter">进入网站 →</a>
        <a class="btn btn-ghost" href="web-blog/support.html" id="splash-support">技术支持</a>
        <a class="btn btn-ghost" href="web-blog/privacy/index.html" id="splash-privacy">隐私政策</a>
      </div>
    </div>
  </main>
  <footer class="splash-foot">
    © <span id="y"></span> Ivor.C Studio · <a href="web-blog/" id="splash-foot-link">作品与技术支持</a>
  </footer>
  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
    const copy = {
      zh: {
        lead: "用心打造的 iOS 小工具。这里汇集产品介绍、技术支持与隐私政策。",
        enter: "进入网站 →",
        support: "技术支持",
        privacy: "隐私政策",
        foot: "作品与技术支持",
        desc: "Ivor.C Studio — 用心打造的 iOS 小工具。产品介绍、技术支持与隐私政策。",
      },
      en: {
        lead: "Thoughtfully crafted iOS utilities — product info, support, and privacy policies.",
        enter: "Enter site →",
        support: "Support",
        privacy: "Privacy",
        foot: "Apps & support",
        desc: "Ivor.C Studio — thoughtfully crafted iOS utilities. Product info, support, and privacy.",
      },
    };
    function getLang() {
      const fromUrl = new URLSearchParams(location.search).get("lang");
      if (fromUrl === "en" || fromUrl === "zh") return fromUrl;
      return localStorage.getItem("lang") === "en" ? "en" : "zh";
    }
    function apply(lang) {
      const t = copy[lang];
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      document.getElementById("splash-lead").textContent = t.lead;
      document.getElementById("splash-enter").textContent = t.enter;
      document.getElementById("splash-support").textContent = t.support;
      document.getElementById("splash-privacy").textContent = t.privacy;
      document.getElementById("splash-foot-link").textContent = t.foot;
      document.querySelector('meta[name="description"]').setAttribute("content", t.desc);
      document.querySelectorAll(".splash-lang [data-lang]").forEach((btn) => {
        btn.classList.toggle("on", btn.getAttribute("data-lang") === lang);
      });
      document.getElementById("splash-enter").href = "web-blog/?lang=" + lang;
      document.getElementById("splash-support").href = "web-blog/support.html?lang=" + lang;
      document.getElementById("splash-privacy").href = "web-blog/privacy/index.html?lang=" + lang;
      document.getElementById("splash-foot-link").href = "web-blog/?lang=" + lang;
    }
    const lang = getLang();
    localStorage.setItem("lang", lang);
    apply(lang);
    document.querySelectorAll(".splash-lang [data-lang]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const next = btn.getAttribute("data-lang");
        localStorage.setItem("lang", next);
        const url = new URL(location.href);
        url.searchParams.set("lang", next);
        history.replaceState({ lang: next }, "", url);
        apply(next);
      });
    });
  </script>
</body>
</html>
